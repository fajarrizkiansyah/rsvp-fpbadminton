<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSVP Badminton</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
      }

      header {
        background: linear-gradient(90deg, #b91c1c, #1d4ed8);
        padding: 20px;
        text-align: center;
        font-size: 28px;
        font-weight: bold;
      }

      .header-left {
        align-items: center;
        gap: 5px;
      }

      .container {
        max-width: 1000px;
        margin: auto;
        padding: 20px;
      }

      .card {
        background: #1e293b;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 20px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      input,
      select,
      textarea,
      button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        box-sizing: border-box;
      }

      button {
        background: #dc2626;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }

      .hapus-btn {
        background: #475569;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }

      .table th,
      .table td {
        border-bottom: 1px solid #475569;
        padding: 10px;
        text-align: left;
      }

      .success {
        color: #22c55e;
        margin-top: 10px;
      }

      .logo {
        width: 150px;
        margin-bottom: 1px;
      }

      .statistik-box {
        display: flex;
        gap: 15px;
        margin-top: 15px;
        flex-wrap: wrap;
      }

      .stat-item {
        flex: 1;
        background: #334155;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        min-width: 150px;
        margin-bottom: 20px;
      }

      .stat-item p {
        margin: 0;
        font-size: 14px;
        color: #cbd5e1;
      }

      .stat-item h1 {
        margin-top: 10px;
        font-size: 32px;
      }

      @media (max-width: 768px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="header-left">
        <img src="FARRASINDO.png" alt="" class="logo" />
      </div>
      🏸 FARRASINDO BADMINTON <br />
      Lokasi Hall : Tunas Bugar Badminton <br />
      Jadwal : Setiap Jumat (Member Bulan Juni 2026) <br />
      Jam : 18:00 s.d 21:00
    </header>

    <div class="container">
      <div class="grid">
        <div class="card">
          <h2>Input Kehadiran</h2>

          <input type="text" id="nama" placeholder="Nama Member" />

          <select id="status">
            <option value="Hadir">Hadir</option>
            <option value="Tidak Hadir">Tidak Hadir</option>
          </select>

          <select id="divisi">
            <option value="" selected disabled>---Pilih Divisi---</option>
            <option value="Inti-Jaya">Inti Jaya</option>
            <option value="Kasir">Kasir</option>
            <option value="Mekanik">Mekanik</option>
            <option value="Purch-Log">Purchasing / Logistik</option>
            <option value="Marketing-Sales">Marketing / Sales</option>
            <option value="Ops-Office">Operasional Office</option>
            <option value="Ops-Lap">Operasional Plant</option>
            <option value="Finance-Acc">Finance & Accounting</option>
            <option value="Pajak-Tax">Pajak / Tax</option>
            <option value="IT">IT</option>
            <option value="FBI">FBI Lantai 5</option>
            <option value="Eksternal-FP">Eksternal-FP</option>
          </select>

          <button type="button" onclick="kirimRSVP()">Kirim RSVP</button>

          <div class="success" id="notif"></div>
        </div>

        <div class="statistik-box">
          <div class="stat-item">
            <p>Total Hadir</p>
            <h1 id="totalHadir">0</h1>
          </div>

          <div class="stat-item">
            <p>Total Tidak Hadir</p>
            <h1 id="totalTidakHadir">0</h1>
          </div>

          <div class="stat-item">
            <p>Total RSVP</p>
            <h1 id="totalRSVP">0</h1>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Daftar Kehadiran</h2>

        <table class="table">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Status</th>
              <th>Divisi</th>
            </tr>
          </thead>

          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <script>
     let data = JSON.parse(localStorage.getItem("badminton_rsvp")) || [];

      function renderData() {
        const tableBody = document.getElementById("tableBody");

        tableBody.innerHTML = "";

        let hadir = 0;
        let tidakHadir = 0;

        for (let i = 0; i < data.length; i++) {
          if (data[i].status === "Hadir") {
            hadir++;
          }
          if (data[i].status === "Tidak Hadir") {
            tidakHadir++;
          }

          tableBody.innerHTML += `
        <tr>
            <td>${data[i].nama}</td>
            <td>${data[i].status}</td>
            <td>${data[i].divisi}</td>
        </tr>
        `;
        }

        document.getElementById("totalHadir").innerText = hadir;
        document.getElementById("totalTidakHadir").innerText = tidakHadir;
        document.getElementById("totalRSVP").innerText = data.length;
      }

      async function kirimRSVP() {
        const nama = document.getElementById("nama").value.trim();
        const status = document.getElementById("status").value;
        const divisi = document.getElementById("divisi").value;

        if (nama === "") {
          alert("Nama wajib diisi");
          return;
        }

        if (divisi === "") {
          alert("Silakan pilih divisi");
          return;
        }

        /**const cekNama = data.some(
          (item) => item.nama.toLowerCase() === nama.toLowerCase()
        );**/

        /**if (cekNama) {
          alert("Nama sudah terdaftar!");
          return;
        }**/

        const response = await fetch(
          "https://script.google.com/macros/s/AKfycbyA6GdiXjzUpOB0Q54l6NN_UcprISJyoHF3oIIUlfhnEWdF2K9l4eEOyTUKP_jBvDa5Nw/exec",
          {
            method: "POST",
            body: JSON.stringify({
              nama: nama,
              status: status,
              divisi: divisi,
            }),
          }
        );

        const member = {
          nama: nama,
          status: status,
          divisi: divisi,
        };

        data.push(member);

        localStorage.setItem("badminton_rsvp", JSON.stringify(data));

        renderData();

        document.getElementById("nama").value = "";
        document.getElementById("divisi").selectedIndex = 0;
        /**document.getElementById("catatan").value = "";**/

        document.getElementById("notif").innerText =
          "Data Berhasil Di Input, Terimakasih!";

        loadData();
        setInterval(() => {
          loadData();
        }, 500);
      }

      async function loadData() {
        const response = await fetch(
          "https://script.google.com/macros/s/AKfycbyA6GdiXjzUpOB0Q54l6NN_UcprISJyoHF3oIIUlfhnEWdF2K9l4eEOyTUKP_jBvDa5Nw/exec"
        );

        const data = await response.json();

        const tableBody = document.getElementById("tableBody");

        tableBody.innerHTML = "";

        let hadir = 0;
        let tidakHadir = 0;

        data.forEach((item) => {
          if (item.status === "Hadir") {
            hadir++;
          }

          if (item.status === "Tidak Hadir") {
            tidakHadir++;
          }

          tableBody.innerHTML += `
        <tr>
            <td>${item.nama}</td>
            <td>${item.status}</td>
            <td>${item.divisi}</td>
        </tr>
        `;
        });

        document.getElementById("totalHadir").innerText = hadir;
        document.getElementById("totalTidakHadir").innerText = tidakHadir;
        document.getElementById("totalRSVP").innerText = data.length;
      }

      loadData();
      setInterval(() => {
        loadData();
      }, 500);

      /**function hapusSemua() {
        const yakin = confirm("Yakin ingin menghapus semua data?");

        if (yakin) {
          localStorage.removeItem("badminton_rsvp");

          data = [];

          renderData();

          document.getElementById("notif").innerText =
            "Semua data berhasil dihapus";
        }
      }**/

      renderData();
    </script>
  </body>
</html>
